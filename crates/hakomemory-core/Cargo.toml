[package]
name = "hakomemory-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Local-first embedded knowledge engine facade for HakoDB"

[features]
default = []
source-pdf = ["dep:pdf-extract"]
source-yaml = ["dep:serde_yaml"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }
tracing = { workspace = true }
hakodb = { workspace = true }
hakomemory-embed = { path = "../hakomemory-embed" }
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
streaming-iterator = "0.1.9"
notify = "8.2.2"
pdf-extract = { version = "0.12", optional = true }
serde_yaml = { version = "0.9", optional = true }
