[workspace]
resolver = "2"
members = ["crates/mb-poc", "crates/mb-server", "crates/mb-embed"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
hakodb = { git = "https://github.com/hakodb/hakodb", tag = "v0.21.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
