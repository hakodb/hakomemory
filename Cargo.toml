[workspace]
resolver = "2"
members = ["crates/hakomemory-core", "crates/hakomemory-poc", "crates/hakomemory-server", "crates/hakomemory-embed", "crates/hakomemory-embed-adapter", "crates/hakomemory-embed-srv"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
hakodb = { version = "0.23.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
